; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Versión específica de ESP32 core 2.0.17
platform_packages = 
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/2.0.17/esp32-2.0.17.zip

; Librerías necesarias
lib_deps = 
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^6.21
    https://github.com/taligentx/dscKeybusInterface.git

; Optimizaciones
build_flags = 
    -Os
    -DBOARD_HAS_PSRAM
    -std=gnu++11

; Opciones de compilación
lib_archive = false
lib_compat_mode = strict